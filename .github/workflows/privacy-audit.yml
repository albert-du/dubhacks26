name: Privacy & security audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (redaction, parsing, clustering)
        run: npm test
      - name: Privacy guardrails (VEYZL.md R1–R9: anonymity, unguessable ids, retention, deletion)
        run: npm run audit:privacy

  # Reviews the diff against VEYZL.md. There is no published VEYZL action;
  # npm run audit:veyzl is the check, and it fails on high findings.
  veyzl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: VEYZL review (policy VEYZL.md, fail-on high)
        env:
          VEYZL_FAIL_ON: high
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          VEYZL_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          VEYZL_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run audit:veyzl
